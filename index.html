<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Altair Career OS</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1220;color:#e5eaf3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#6ee7d4}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #263348;background:#0e1928;gap:12px}header strong{font-size:20px}header small{color:#a4b2c6;display:block}button,.btn{background:#18293b;color:#e5eaf3;border:1px solid #30435b;border-radius:9px;padding:9px 13px;text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:#53dbc9}button.primary,.primary{background:#087e79;border-color:#10aea4;color:white}button.danger{background:#4f202b;border-color:#8e4653}button:disabled{opacity:.5;cursor:not-allowed}nav{display:flex;gap:7px;flex-wrap:wrap;padding:14px 22px;background:#0e1928;border-bottom:1px solid #263348}nav button.active{background:#16544f;border-color:#3acdb9}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 4px}h2{font-size:17px;margin:0 0 14px}h3{font-size:15px}.muted{color:#9aadc3}.small{font-size:12px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.split{display:grid;grid-template-columns:minmax(290px,1fr) minmax(420px,1.65fr);gap:18px}.panel{background:#111e2e;border:1px solid #2b3d53;border-radius:15px;padding:18px;margin-bottom:16px}.metric{font-size:30px;font-weight:750;color:#64e1ca}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack>*{margin-bottom:11px}label{display:block;font-size:12px;color:#a6bad0;margin:11px 0 5px}input,textarea,select{background:#0b1625;border:1px solid #31455e;color:#e5eaf3;border-radius:8px;padding:10px;width:100%;outline-color:#42d8bf}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:auto}select{min-width:95px}.tag{border:1px solid #395267;border-radius:6px;padding:3px 8px;color:#9fe7dc;font-size:12px;display:inline-block}.job{padding:14px;border:1px solid #2c4258;border-radius:11px;margin-bottom:9px;cursor:pointer}.job:hover,.job.selected{background:#173044;border-color:#3ad0c1}.job h3{margin:0}.line{border-top:1px solid #293c52;margin:16px 0}.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tasks{display:flex;flex-direction:column;gap:7px}.task{display:flex;align-items:center;gap:10px;border:1px solid #273c51;border-radius:8px;padding:8px}.task span{flex:1}.task.done span{text-decoration:line-through;color:#8698ac}.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:13px;overflow-x:auto}.boardcol{border:1px solid #2e4057;border-radius:12px;background:#101c2b;padding:12px;min-height:190px}.boardcol h3{margin:0 0 13px}.boardcard{border:1px solid #395269;padding:11px;margin:9px 0;border-radius:9px;background:#15283a}.boardcard button{font-size:12px;padding:5px 8px}.pill{color:#77dccc;font-weight:700}.notice{border-left:3px solid #69d7c9;padding:10px 14px;background:#15313b;margin:12px 0}.alert{border-left-color:#dca75f;background:#352b26}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #2b3a4e;vertical-align:top}th{color:#a6bad0}details{margin:10px 0}summary{cursor:pointer}.hidden{display:none!important}@media(max-width:850px){main{padding:15px}.split,.col2,.col3{grid-template-columns:1fr}.board{grid-template-columns:repeat(5,240px)}header{padding:12px;height:auto}nav{padding:10px}} 
</style></head><body>
<header><div><strong>ALTAIR <span style="color:#66dfce">CAREER OS</span></strong><small>Marketing · Creative · Social · Content / Intern & Fresher</small></div><div class="row"><span class="tag" id="saveStatus">Local-first</span><button onclick="toggleLang()" id="langBtn">EN</button><button onclick="exportJSON()">Backup JSON</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<input id="fileImport" type="file" accept=".json,application/json" class="hidden"><input id="fileCSV" type="file" accept=".csv,text/csv" class="hidden">
<script>
'use strict';
const K='altair-career-os-v1';
const statuses=['Unreviewed','Shortlisted','Preparing','Applied','Interview','Offer','Rejected'];
const views=['Dashboard','Opportunities','JD Analysis','Pipeline','CV & Portfolio','Job Sources','GitHub Toolkit','Backup & Audit'];
const langs={vi:['Tổng quan','Cơ hội','Phân tích JD','Pipeline','CV & Portfolio','Nguồn việc','GitHub Toolkit','Sao lưu'],en:views};
const defaultData={jobs:[],profiles:[],sources:[
{id:'s1',name:'LinkedIn Jobs',url:'https://www.linkedin.com/jobs/',type:'Vietnam / Remote',note:'Filter Intern/Fresher, Vietnam, Remote'},
{id:'s2',name:'TopCV',url:'https://www.topcv.vn/',type:'Vietnam',note:'Marketing, Content, Social'},
{id:'s3',name:'VietnamWorks',url:'https://www.vietnamworks.com/',type:'Vietnam',note:'Review schedule, location and work arrangement'},
{id:'s4',name:'Glints',url:'https://glints.com/vn',type:'Vietnam',note:'Intern / Junior and remote filters'},
{id:'s5',name:'YBOX',url:'https://ybox.vn/tuyen-dung',type:'Vietnam',note:'Internships and student opportunities'},
{id:'s6',name:'Wellfound',url:'https://wellfound.com/jobs',type:'Remote / Startup',note:'Check location/timezone eligibility'}],
repos:[{id:'r1',name:'OpenResume',url:'https://github.com/xitanggg/open-resume',purpose:'Resume editing / ATS-friendly structure',status:'Explore'},{id:'r2',name:'Reactive Resume',url:'https://github.com/AmruthPillai/Reactive-Resume',purpose:'Resume builder',status:'Explore'}],logs:[],lang:'vi'};
let db=load(),tab='Dashboard',selected=null,query='',filterStatus='All',filterMode='All',profileSelected=null;
function load(){try{let d=JSON.parse(localStorage.getItem(K));return d&&Array.isArray(d.jobs)?Object.assign(structuredClone(defaultData),d):structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
function save(msg){try{localStorage.setItem(K,JSON.stringify(db));document.getElementById('saveStatus').textContent='Saved locally';if(msg)log(msg,false)}catch(e){alert('Storage full: export a JSON backup. '+e.message)}}
function log(t,persist=true){db.logs.unshift({id:uid(),date:new Date().toISOString(),text:t});db.logs=db.logs.slice(0,400);if(persist)save()}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function q(s){return document.querySelector(s)}function all(s){return [...document.querySelectorAll(s)]}
function tr(vi,en){return db.lang==='vi'?vi:en}
function toggleLang(){db.lang=db.lang==='vi'?'en':'vi';save();render()}
function go(v){tab=v;render()}
function header(title,sub,actions=''){return '<div class="hero"><div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="row">'+actions+'</div></div>'}
function render(){q('#langBtn').textContent=db.lang==='vi'?'EN':'VI';q('#nav').innerHTML=views.map((v,i)=>'<button class="'+(tab===v?'active':'')+'" onclick="go('+JSON.stringify(v).replace(/"/g,"'")+')">'+langs[db.lang][i]+'</button>').join('');q('#app').innerHTML=({Dashboard:dashboard,Opportunities:opportunities,'JD Analysis':analysis,Pipeline:pipeline,'CV & Portfolio':profiles,'Job Sources':sources,'GitHub Toolkit':repos,'Backup & Audit':backup})[tab]()}
function getJob(){return db.jobs.find(j=>j.id===selected)||db.jobs[0]}
function getProfile(id){return db.profiles.find(p=>p.id===id)||null}
function words(s){return String(s||'').toLowerCase().split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)}
function score(j){let p=getProfile(j.profileId)||db.profiles[0], required=words(j.skills), sk=words(p&&p.skills), evidence=String(p&&p.evidence||'').toLowerCase(),matches=[],missing=[],proved=[];
required.forEach(x=>{let hit=sk.some(y=>y===x||y.includes(x)||x.includes(y));if(hit){matches.push(x);if(evidence.includes(x))proved.push(x)}else missing.push(x)});
let skill=required.length?Math.round(100*(proved.length+(.6*(matches.length-proved.length)))/required.length):50;
let role= p&&p.target&&j.role ? (j.role.toLowerCase().includes(p.target.toLowerCase())||p.target.toLowerCase().includes(j.role.toLowerCase())?100:55):60;
let level=/(intern|fresher|junior|thực tập)/i.test(j.level)?100:35;
let schedule=j.mode==='Remote'?90:j.schedule==='Office hours'?95:j.schedule==='Shift / Flexible'?55:75;
let fit=Math.round(.55*skill+.2*role+.15*level+.1*schedule);
let urgency=j.deadline?Math.max(0,100-Math.max(0,(new Date(j.deadline)-new Date())/86400000)*4):55;
let priority=Math.round(.65*fit+.2*urgency+.15*(j.importance||50));
return {fit,priority,skill,role,level,schedule,matches,missing,proved,profile:p};
}
function badge(n){return '<span class="tag">'+esc(n)+'</span>'}
function dashboard(){const act=db.jobs.filter(j=>!['Rejected','Offer'].includes(j.status)),top=[...act].sort((a,b)=>score(b).priority-score(a).priority).slice(0,6);
return header(tr('Tổng quan tìm việc','Job search overview'),tr('Một workspace duy nhất, dữ liệu lưu trên trình duyệt','One workspace, browser-local data'),' <button class="primary" onclick="newJob()">+ '+tr('Thêm JD','Add JD')+'</button>')+
'<div class="grid">'+[['JD',db.jobs.length],['Shortlisted',db.jobs.filter(j=>j.status==='Shortlisted').length],['Applied',db.jobs.filter(j=>j.status==='Applied').length],['Interview',db.jobs.filter(j=>j.status==='Interview').length],['Offer',db.jobs.filter(j=>j.status==='Offer').length]].map(x=>'<div class="panel"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="split"><div class="panel"><h2>'+tr('Việc nên làm tiếp','Next actions')+'</h2><div class="notice">'+tr('Nhập CV/portfolio trước để có đánh giá dựa trên bằng chứng. Điểm Fit không phải điểm ATS chính thức.','Add CV/portfolio evidence first. Fit is not an official ATS score.')+'</div><p>'+tr('Hồ sơ hiện có','Profiles')+': '+db.profiles.length+'</p><button onclick="go('+"'CV & Portfolio'"+')">'+tr('Quản lý hồ sơ','Manage profiles')+'</button></div><div class="panel"><h2>'+tr('Ưu tiên theo điểm có giải thích','Ranked opportunities')+'</h2>'+top.map(j=>'<div class="job" onclick="openJob('+JSON.stringify(j.id).replace(/"/g,"'")+')"><div class="row between"><strong>'+esc(j.company)+' · '+esc(j.role)+'</strong><span class="pill">'+score(j).priority+'/100</span></div><div class="muted">'+esc(j.level)+' · '+esc(j.mode)+' · '+esc(j.status)+'</div></div>').join('')+(top.length?'':'<p class="muted">'+tr('Chưa có JD.','No jobs yet.')+'</p>')+'</div></div>'}
function openJob(id){selected=id;tab='JD Analysis';render()}
function newJob(){let j={id:uid(),company:'',role:'Content Marketing Intern',level:'Intern',mode:'Remote',schedule:'Office hours',location:'Vietnam',url:'',source:'',salary:'',deadline:'',skills:'',description:'',notes:'',status:'Unreviewed',profileId:db.profiles[0]?.id||'',importance:50,tasks:{},cover:'',created:new Date().toISOString()};db.jobs.unshift(j);selected=j.id;save('New JD created');openJob(j.id)}
function opportunities(){let arr=db.jobs.filter(j=>(filterStatus==='All'||j.status===filterStatus)&&(filterMode==='All'||j.mode===filterMode)&&[j.company,j.role,j.description,j.skills].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>score(b).priority-score(a).priority);
return header(tr('Kho cơ hội','Opportunities'),tr('Lưu JD, lọc remote / giờ hành chính, ưu tiên bằng điểm giải thích','Store JDs, filter work arrangement and rank explainably'),'<button class="primary" onclick="newJob()">+ '+tr('Nhập JD','Add JD')+'</button><button onclick="exportCSV()">CSV</button>')+
'<div class="panel"><div class="col3"><div><label>'+tr('Tìm kiếm','Search')+'</label><input id="searchJ" placeholder="Company, role, skills..." value="'+esc(query)+'" oninput="query=this.value;renderList()"></div><div><label>Status</label><select id="filterS" onchange="filterStatus=this.value;renderList()">'+['All',...statuses].map(x=>'<option '+(x===filterStatus?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>'+tr('Chế độ','Mode')+'</label><select id="filterM" onchange="filterMode=this.value;renderList()">'+['All','Remote','Hybrid','Onsite'].map(x=>'<option '+(x===filterMode?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div></div><div id="listJ">'+listJobs(arr)+'</div>'}
function renderList(){const a=db.jobs.filter(j=>(filterStatus==='All'||j.status===filterStatus)&&(filterMode==='All'||j.mode===filterMode)&&[j.company,j.role,j.description,j.skills].join(' ').toLowerCase().includes(query.toLowerCase())).sort((x,y)=>score(y).priority-score(x).priority);q('#listJ').innerHTML=listJobs(a)}
function listJobs(a){return a.map(j=>'<div class="job" onclick="openJob('+JSON.stringify(j.id).replace(/"/g,"'")+')"><div class="row between"><div><h3>'+esc(j.company||'(Company pending)')+' — '+esc(j.role)+'</h3><span class="muted">'+esc(j.level)+' · '+esc(j.mode)+' · '+esc(j.schedule)+' · '+esc(j.status)+'</span></div><div><strong class="pill">Fit '+score(j).fit+'% · Priority '+score(j).priority+'</strong></div></div></div>').join('')||'<div class="panel muted">'+tr('Chưa có kết quả.','No matching opportunities.')+'</div>'}
function field(j,k,name,type='text',opts){let val=j[k]??'';let core='data-j="'+esc(k)+'" ';let el=opts?'<select '+core+'>'+opts.map(x=>'<option value="'+esc(x)+'" '+(val===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':type==='textarea'?'<textarea '+core+'>'+esc(val)+'</textarea>':'<input type="'+type+'" '+core+' value="'+esc(val)+'">';return '<div><label>'+name+'</label>'+el+'</div>'}
function saveJob(){let j=getJob();if(!j)return;all('[data-j]').forEach(e=>{j[e.dataset.j]=e.dataset.j==='importance'?Number(e.value):e.value});save('Updated '+j.company+' / '+j.role);render()}
function delJob(){let j=getJob();if(j&&confirm('Delete job: '+j.company+' '+j.role+'?')){db.jobs=db.jobs.filter(x=>x.id!==j.id);selected=null;save('Deleted a JD');tab='Opportunities';render()}}
function tasksFor(j){let s=score(j),arr=[{key:'research',label:tr('Kiểm tra công ty, nguồn tuyển và deadline','Verify company, listing and deadline')},{key:'cv',label:tr('Chọn phiên bản CV theo đúng vị trí','Select a role-specific CV version')},{key:'proof',label:tr('Thêm ví dụ kết quả / sản phẩm vào portfolio','Add concrete portfolio outcomes')},{key:'cover',label:tr('Điều chỉnh cover letter, không tự bịa kinh nghiệm','Tailor cover letter, do not invent experience')},{key:'apply',label:tr('Kiểm tra file/link và nộp đúng kênh','Verify links/files and submit via official channel')}];
s.missing.forEach(x=>arr.push({key:'gap-'+x,label:tr('Bổ sung bằng chứng hoặc kế hoạch học: ','Add evidence or learning plan: ')+x}));
return arr}
function setTask(id,key,checked){let j=db.jobs.find(x=>x.id===id);if(j){j.tasks[key]=checked;save('Checklist updated');render()}}
function genCover(){let j=getJob(),p=score(j).profile;if(!j)return;let t=db.lang==='vi'?'Kính gửi bộ phận tuyển dụng '+(j.company||'[Tên công ty]')+',\n\nTôi quan tâm vị trí '+j.role+'. '+(p?'Hồ sơ hiện tại của tôi tập trung vào '+(p.target||'Marketing / Content')+'. ':'')+'Tôi mong muốn đóng góp thông qua các kỹ năng và sản phẩm thực tế đã được thể hiện trong CV/portfolio đính kèm.\n\n'+(score(j).proved.length?'Các năng lực có bằng chứng tương quan: '+score(j).proved.join(', ')+'.\n\n':'')+'Tôi mong có cơ hội trao đổi cụ thể về cách đáp ứng yêu cầu công việc. Cảm ơn anh/chị đã xem xét hồ sơ.\n\nTrân trọng,\nAltair':'Dear '+(j.company||'Hiring Team')+',\n\nI am applying for the '+j.role+' position. '+(p?'My current focus is '+(p.target||'Marketing / Content')+'. ':'')+'My CV and portfolio provide concrete examples of my work and learning process.\n\n'+(score(j).proved.length?'Relevant evidenced skills: '+score(j).proved.join(', ')+'.\n\n':'')+'I would welcome an opportunity to discuss how I could contribute to your team.\n\nBest regards,\nAltair';j.cover=t;save('Cover draft generated');render()}
function copyCover(){navigator.clipboard.writeText(getJob()?.cover||'').then(()=>alert('Copied'))}
function analysis(){let j=getJob();if(!j)return header(tr('Phân tích JD','JD Analysis'),tr('Nhập một JD để bắt đầu','Add a JD first'),'<button class="primary" onclick="newJob()">+ JD</button>');let s=score(j);
return header(tr('Phân tích & chỉnh hồ sơ','JD fit & application preparation'),tr('Điểm có thể kiểm chứng, không phải ATS chính thức','Explainable heuristic, not an official ATS score'),'<button class="primary" onclick="saveJob()">'+tr('Lưu thay đổi','Save changes')+'</button><button class="danger" onclick="delJob()">'+tr('Xóa JD','Delete JD')+'</button>')+
'<div class="grid"><div class="panel"><div class="muted">Fit Score</div><div class="metric">'+s.fit+'%</div></div><div class="panel"><div class="muted">Priority Score</div><div class="metric">'+s.priority+'/100</div></div><div class="panel"><div class="muted">'+tr('Có trong hồ sơ','Skills listed')+'</div><div class="metric">'+s.matches.length+'</div></div><div class="panel"><div class="muted">'+tr('Thiếu kỹ năng','Skill gaps')+'</div><div class="metric">'+s.missing.length+'</div></div></div>'+
'<div class="split"><div class="panel"><h2>'+tr('Thông tin tuyển dụng','Job details')+'</h2><div class="col2">'+field(j,'company',tr('Công ty','Company'))+field(j,'role',tr('Vị trí','Role'))+field(j,'level','Level','text',['Intern','Fresher','Junior','Mid','Senior'])+field(j,'mode',tr('Chế độ','Mode'),'text',['Remote','Hybrid','Onsite'])+field(j,'schedule',tr('Giờ làm','Schedule'),'text',['Office hours','Shift / Flexible','Unknown'])+field(j,'status','Status','text',statuses)+field(j,'location',tr('Địa điểm','Location'))+field(j,'deadline','Deadline','date')+field(j,'source',tr('Nguồn','Source'))+field(j,'url','JD URL','url')+field(j,'salary',tr('Lương','Salary'))+field(j,'importance',tr('Mức quan tâm 0–100','Personal interest 0–100'),'number')+'</div>'+field(j,'skills',tr('Kỹ năng JD, phân cách bằng dấu phẩy','JD skills, comma separated'),'textarea')+field(j,'description',tr('Nội dung JD','Full job description'),'textarea')+field(j,'notes',tr('Ghi chú, thông tin cần xác thực','Notes / verification'),'textarea')+'<label>CV / Portfolio Version</label><select data-j="profileId"><option value="">— None —</option>'+db.profiles.map(p=>'<option value="'+esc(p.id)+'" '+(j.profileId===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
'<div><div class="panel"><h2>'+tr('Lý do chấm điểm','Scoring rationale')+'</h2><div class="notice">Fit = 55% '+tr('kỹ năng','skills')+' + 20% '+tr('nhóm nghề','role')+' + 15% seniority + 10% '+tr('điều kiện','work mode')+'. Priority = 65% Fit + 20% deadline urgency + 15% personal interest. '+tr('Thiếu CV/skills sẽ giảm độ tin cậy điểm số.','Scores are less reliable without a populated CV and skills.')+'</div><p>Skills: '+s.skill+'% · Role: '+s.role+'% · Level: '+s.level+'% · Work: '+s.schedule+'%</p><p><b>'+tr('Đã có bằng chứng','Evidence in CV')+':</b> '+(s.proved.map(badge).join(' ')||'—')+'</p><p><b>'+tr('Có liệt kê nhưng thiếu bằng chứng','Listed without evidence')+':</b> '+(s.matches.filter(x=>!s.proved.includes(x)).map(badge).join(' ')||'—')+'</p><p><b>'+tr('Thiếu','Missing')+':</b> '+(s.missing.map(badge).join(' ')||'—')+'</p></div><div class="panel"><h2>JD Checklist <span class="muted small">(</span>'+tasksFor(j).filter(t=>j.tasks[t.key]).length+'/'+tasksFor(j).length+')</h2><div class="tasks">'+tasksFor(j).map(t=>'<label class="task '+(j.tasks[t.key]?'done':'')+'"><input type="checkbox" '+(j.tasks[t.key]?'checked':'')+' onchange="setTask('+JSON.stringify(j.id).replace(/"/g,"'")+','+JSON.stringify(t.key).replace(/"/g,"'")+',this.checked)"><span>'+esc(t.label)+'</span></label>').join('')+'</div></div><div class="panel"><div class="row between"><h2>Cover Letter Draft</h2><button onclick="genCover()">'+tr('Tạo bản nháp','Generate draft')+'</button><button onclick="copyCover()">'+tr('Sao chép','Copy')+'</button></div><textarea id="coverDraft" style="min-height:240px" onblur="getJob().cover=this.value;save()">'+esc(j.cover||'')+'</textarea><p class="muted small">'+tr('Kiểm tra mọi tuyên bố trước khi nộp.','Verify all claims before submission.')+'</p></div></div></div>'}
function setStatus(id,status){let j=db.jobs.find(x=>x.id===id);if(j){j.status=status;save('Status '+j.company+': '+status);render()}}

function newProfile(){let p={id:uid(),name:'CV - Marketing Intern - v1',target:'Marketing',skills:'',evidence:'',portfolio:'',cv:'',notes:'',updated:new Date().toISOString()};db.profiles.unshift(p);profileSelected=p.id;save('New CV/portfolio created');render()}

return header('CV & Portfolio Vault',tr('Lưu phiên bản, bằng chứng kỹ năng và liên kết tài sản','Store versions, skill evidence and portfolio links'),'<button class="primary" onclick="newProfile()">+ Version</button>')+'<div class="split"><div class="panel"><h2>Versions</h2>'+db.profiles.map(x=>'<div class="job '+(p&&x.id===p.id?'selected':'')+'" onclick="profileSelected='+JSON.stringify(x.id).replace(/"/g,"'")+';render()"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.target)+' · '+new Date(x.updated).toLocaleDateString()+'</div></div>').join('')+'</div><div class="panel">'+(p?'<div class="row between"><h2>'+esc(p.name)+'</h2><button class="primary" onclick="saveProfile()">Save</button><button class="danger" onclick="removeProfile()">Delete</button></div>'+[['name','Version name'],['target','Target role'],['skills','Skills (comma separated)'],['evidence','Evidence and measurable outcomes (include named skills)'],['portfolio','Portfolio URLs / case studies'],['cv','CV text / link / file reference'],['notes','Notes']].map(([k,n])=>'<label>'+n+'</label>'+(k==='name'||k==='target'?'<input data-p="'+k+'" value="'+esc(p[k])+'">':'<textarea data-p="'+k+'">'+esc(p[k])+'</textarea>')).join('')+'<div class="notice">'+tr('Mỗi JD có thể gắn với một phiên bản. Không đăng CV cá nhân trong GitHub repo public.','Each JD can link to a version. Do not publish personal CV files in a public repository.')+'</div>':'<p class="muted">'+tr('Chưa có profile.','Create a profile to start.')+'</p>')+'</div></div>'}
function addSource(){let n=prompt('Source name');if(!n)return;let u=prompt('URL')||'';db.sources.push({id:uid(),name:n,url:u,type:'Custom',note:''});save('Source added');render()}
function editSource(id){let s=db.sources.find(x=>x.id===id),n=prompt('Source name',s.name);if(n===null)return;s.name=n;s.url=prompt('URL',s.url)||s.url;s.type=prompt('Type',s.type)||s.type;s.note=prompt('Notes',s.note)||s.note;save('Source edited');render()}
function removeSource(id){if(confirm('Remove source?')){db.sources=db.sources.filter(x=>x.id!==id);save('Source removed');render()}}
function sources(){return header(tr('Nguồn tuyển dụng','Job sources'),tr('Danh mục tham khảo, không phải các tin tuyển dụng đã xác thực','Reference directory, not verified live postings'),'<button class="primary" onclick="addSource()">+ Source</button>')+'<div class="panel"><table><tr><th>Source</th><th>Type</th><th>Notes</th><th>Actions</th></tr>'+db.sources.map(s=>'<tr><td><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.name)+'</a></td><td>'+esc(s.type)+'</td><td>'+esc(s.note)+'</td><td><button onclick="editSource('+JSON.stringify(s.id).replace(/"/g,"'")+')">Edit</button> <button onclick="removeSource('+JSON.stringify(s.id).replace(/"/g,"'")+')">×</button></td></tr>').join('')+'</table></div>'}
function addRepo(){let n=prompt('Repository name');if(!n)return;let u=prompt('GitHub URL')||'';db.repos.push({id:uid(),name:n,url:u,purpose:'',status:'Explore'});save('GitHub repo tracked');render()}
function editRepo(id){let r=db.repos.find(x=>x.id===id),n=prompt('Name',r.name);if(n===null)return;r.name=n;r.url=prompt('URL',r.url)||r.url;r.purpose=prompt('Purpose',r.purpose)||r.purpose;r.status=prompt('Status',r.status)||r.status;save('Repo edited');render()}

function repos(){return header('GitHub Toolkit',tr('Theo dõi công cụ CV, ATS, job automation và quy trình sử dụng','Track CV, ATS and job tooling'),'<button class="primary" onclick="addRepo()">+ GitHub repo</button>')+'<div class="grid">'+db.repos.map(r=>'<div class="panel"><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.purpose)+'</p>'+badge(r.status)+'<p><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">GitHub repository</a></p><button onclick="editRepo('+JSON.stringify(r.id).replace(/"/g,"'")+')">Edit</button> <button onclick="removeRepo('+JSON.stringify(r.id).replace(/"/g,"'")+')">×</button></div>').join('')+'</div><p class="notice">'+tr('Các repository tham khảo chưa được kiểm tra bảo mật. Không cấp quyền truy cập tài khoản hoặc nộp hồ sơ tự động nếu chưa rà soát kỹ.','Listed repositories are reference links, not security-verified integrations. Review permissions before using automation.')+'</p>'}
function dl(filename,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){dl('altair-career-os-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
function importJSON(){q('#fileImport').click()}
q('#fileImport').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.jobs)||!Array.isArray(d.profiles))throw Error('Invalid backup');if(!confirm('Replace all current workspace data with this backup?'))return;db=Object.assign(structuredClone(defaultData),d);save('Backup restored');selected=null;render()}catch(x){alert(x.message)}e.target.value=''});
function csvValue(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(){let keys=['company','role','level','mode','schedule','location','url','source','salary','deadline','skills','description','status','notes'];dl('altair-jobs.csv','\uFEFF'+keys.join(',')+'\r\n'+db.jobs.map(j=>keys.map(k=>csvValue(j[k])).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function importCSV(){q('#fileCSV').click()}
function parseCSV(t){let rows=[],row=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x))rows.push(row);return rows}
q('#fileCSV').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let rows=parseCSV((await f.text()).replace(/^\uFEFF/,'')),head=rows.shift().map(x=>x.trim());let accepted=['company','role','level','mode','schedule','location','url','source','salary','deadline','skills','description','status','notes'];if(!head.includes('role'))throw Error('CSV needs role column');rows.forEach(a=>{let j={id:uid(),status:'Unreviewed',mode:'Remote',schedule:'Unknown',level:'Intern',importance:50,tasks:{},cover:'',created:new Date().toISOString()};head.forEach((k,i)=>{if(accepted.includes(k))j[k]=a[i]||j[k]||''});db.jobs.push(j)});save('Imported '+rows.length+' rows');render();alert('Imported '+rows.length+' rows')}catch(x){alert(x.message)}e.target.value=''});
function backup(){return header(tr('Sao lưu & kiểm toán','Backup & audit'),tr('Dữ liệu lưu trên từng trình duyệt; không đồng bộ đa thiết bị','Data stays in this browser; no cross-device sync'))+'<div class="split"><div class="panel"><h2>Backup / Restore</h2><p class="notice alert">'+tr('GitHub Pages phục vụ mã nguồn công khai. Dữ liệu JD, CV, portfolio vẫn riêng trong localStorage của trình duyệt và không được đưa lên GitHub.','GitHub Pages serves public app code only. Your data stays in browser localStorage, not GitHub.')+'</p><div class="row"><button class="primary" onclick="exportJSON()">Export JSON</button><button onclick="importJSON()">Restore JSON</button><button onclick="exportCSV()">Export CSV</button><button onclick="importCSV()">Import CSV</button></div><p class="muted">'+tr('Xuất backup định kỳ và giữ file ở nơi riêng tư. Xóa dữ liệu trình duyệt có thể làm mất dữ liệu.','Export private backups regularly; clearing browser data can erase your work.')+'</p></div><div class="panel"><h2>Audit Trail</h2><div style="max-height:450px;overflow:auto">'+db.logs.slice(0,70).map(l=>'<div class="job"><span class="muted small">'+new Date(l.date).toLocaleString()+'</span><div>'+esc(l.text)+'</div></div>').join('')+'</div></div></div>'}
